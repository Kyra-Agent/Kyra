<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Kyra Agent - Deploy agents on Robinhood Chain</title>
  <defs>
    <radialGradient id="auroraBlue" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(170 40) rotate(35) scale(620 420)">
      <stop stop-color="#4F80FF" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#4F80FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auroraMint" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1080 120) rotate(140) scale(520 360)">
      <stop stop-color="#3CDCAA" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#3CDCAA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auroraViolet" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(760 660) rotate(-20) scale(560 300)">
      <stop stop-color="#966EFF" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#966EFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="64" y1="0" x2="560" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8FB6FF"/>
      <stop offset="0.5" stop-color="#8EF0C4"/>
      <stop offset="1" stop-color="#B29BFF"/>
    </linearGradient>
    <linearGradient id="beam" x1="660" y1="96" x2="1136" y2="534" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8EF0C4" stop-opacity="0.9"/>
      <stop offset="0.35" stop-color="#7AA8FF" stop-opacity="0.55"/>
      <stop offset="0.7" stop-color="#7AA8FF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#B29BFF" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="96" x2="0" y2="534" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0E1420" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#070A11" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="primary" x1="64" y1="452" x2="300" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A6C5FF"/>
      <stop offset="0.55" stop-color="#6C9BFF"/>
      <stop offset="1" stop-color="#5FD4AE"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(600 300) scale(760 470)">
      <stop offset="0.55" stop-color="#04060A" stop-opacity="0"/>
      <stop offset="1" stop-color="#020306" stop-opacity="0.7"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" stroke="#94AACD" stroke-opacity="0.07"/>
    </pattern>
    <radialGradient id="gridMask" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(600 0) scale(820 520)">
      <stop stop-color="#fff"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridFade">
      <rect width="1200" height="630" fill="url(#gridMask)"/>
    </mask>
  </defs>

  <rect width="1200" height="630" fill="#04060A"/>
  <rect width="1200" height="630" fill="url(#auroraBlue)"/>
  <rect width="1200" height="630" fill="url(#auroraMint)"/>
  <rect width="1200" height="630" fill="url(#auroraViolet)"/>
  <rect width="1200" height="630" fill="url(#grid)" mask="url(#gridFade)"/>
  <rect width="1200" height="630" fill="url(#vignette)"/>

  <!-- Copy column -->
  <g font-family="Geist Variable, Geist, Inter, Segoe UI, sans-serif">
    <rect x="64" y="72" width="372" height="36" rx="18" fill="#0A0F18" stroke="url(#accent)" stroke-opacity="0.9"/>
    <circle cx="86" cy="90" r="5" fill="#8EF0C4"/>
    <text x="100" y="95" fill="#F3F7FF" font-family="Geist Mono Variable, Geist Mono, Consolas, monospace" font-size="14" font-weight="600" letter-spacing="1.6">ROBINHOOD CHAIN · AGENT PLATFORM</text>

    <text x="62" y="196" fill="#F3F7FF" font-size="68" font-weight="650" letter-spacing="-3">Deploy agents on</text>
    <text x="62" y="272" fill="url(#accent)" font-size="68" font-weight="650" letter-spacing="-3">Robinhood Chain.</text>

    <text x="64" y="328" fill="#AAB8CC" font-size="22" font-weight="400">Telegram-native AI agents with private workspaces.</text>
    <text x="64" y="360" fill="#AAB8CC" font-size="22" font-weight="400">Every onchain action needs your wallet approval.</text>

    <g font-size="16" font-weight="600" fill="#F3F7FF">
      <rect x="64" y="398" width="156" height="40" rx="12" fill="#FFFFFF" fill-opacity="0.04" stroke="#94AACD" stroke-opacity="0.22"/>
      <circle cx="84" cy="418" r="4" fill="#8EF0C4"/>
      <text x="96" y="424">Telegram live</text>
      <rect x="230" y="398" width="168" height="40" rx="12" fill="#FFFFFF" fill-opacity="0.04" stroke="#94AACD" stroke-opacity="0.22"/>
      <circle cx="250" cy="418" r="4" fill="#8EF0C4"/>
      <text x="262" y="424">Wallet approval</text>
      <rect x="408" y="398" width="132" height="40" rx="12" fill="#FFFFFF" fill-opacity="0.04" stroke="#94AACD" stroke-opacity="0.22"/>
      <circle cx="428" cy="418" r="4" fill="#8EF0C4"/>
      <text x="440" y="424">No custody</text>
    </g>

    <rect x="64" y="470" width="200" height="52" rx="14" fill="url(#primary)"/>
    <text x="164" y="502" fill="#04101F" font-size="18" font-weight="650" text-anchor="middle">Deploy an agent</text>
    <text x="284" y="503" fill="#93A3B9" font-family="Geist Mono Variable, Geist Mono, Consolas, monospace" font-size="17" font-weight="500">kyraagent.xyz</text>
  </g>

  <!-- Command center panel -->
  <rect x="660" y="96" width="476" height="438" rx="26" fill="url(#panel)"/>
  <rect x="660.75" y="96.75" width="474.5" height="436.5" rx="25.25" stroke="url(#beam)" stroke-width="1.5"/>
  <path d="M661 150H1135" stroke="#94AACD" stroke-opacity="0.12"/>
  <circle cx="690" cy="123" r="6" fill="#FF8A95"/>
  <circle cx="710" cy="123" r="6" fill="#F6C978"/>
  <circle cx="730" cy="123" r="6" fill="#8EF0C4"/>
  <g font-family="Geist Mono Variable, Geist Mono, Consolas, monospace">
    <text x="898" y="128" fill="#93A3B9" font-size="14" text-anchor="middle">kyra command center</text>
    <text x="1112" y="128" fill="#8EF0C4" font-size="13" text-anchor="end">guarded</text>

    <g font-size="15.5" fill="#E6EEFB">
      <text x="690" y="194"><tspan fill="#8EF0C4">&gt; </tspan>kyra deploy --template operator</text>
      <text x="690" y="228"><tspan fill="#8EF0C4">&gt; </tspan>NIRA-01  intent routing online</text>
      <text x="690" y="262"><tspan fill="#8EF0C4">&gt; </tspan>NOVA-04  workspace data ready</text>
      <text x="690" y="296"><tspan fill="#8EF0C4">&gt; </tspan>NYX-05   approval guard active</text>
      <text x="690" y="330"><tspan fill="#8EF0C4">&gt; </tspan>telegram&gt; review transfer</text>
      <text x="690" y="364" fill="#93A3B9"><tspan fill="#8EF0C4">&gt; </tspan>status: wallet_approval_required</text>
    </g>
  </g>

  <g font-family="Geist Variable, Geist, Inter, Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#F3F7FF">
    <rect x="690" y="398" width="200" height="48" rx="14" fill="#FFFFFF" fill-opacity="0.035" stroke="#94AACD" stroke-opacity="0.18"/>
    <text x="712" y="427">Telegram commands</text>
    <rect x="906" y="398" width="200" height="48" rx="14" fill="#FFFFFF" fill-opacity="0.035" stroke="#94AACD" stroke-opacity="0.18"/>
    <text x="928" y="427">Risk guard NYX-05</text>
    <rect x="690" y="458" width="416" height="48" rx="14" fill="#8EF0C4" fill-opacity="0.07" stroke="#8EF0C4" stroke-opacity="0.32"/>
    <text x="898" y="487" text-anchor="middle" fill="#BFF7DE">Explicit wallet approval for every action</text>
  </g>
</svg>
